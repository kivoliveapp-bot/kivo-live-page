<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KIVO — Account Deletion Request</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; font-family:Arial,Tahoma,sans-serif;
  background:linear-gradient(135deg,#090611,#171027); color:#fff;
}
.card{
  width:100%; max-width:520px; padding:30px; border-radius:24px;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 60px rgba(0,0,0,.4); backdrop-filter:blur(12px);
}
.logo{font-size:32px;font-weight:900;text-align:center}
.subtitle{text-align:center;color:#b9b4c8;line-height:1.7;margin:8px 0 28px}
label{display:block;margin:0 0 8px;font-weight:700}
input{
  width:100%; padding:15px; border:1px solid #3b334d; border-radius:13px;
  background:#0e0a17;color:#fff;font-size:16px;outline:none;
}
input:focus{border-color:#b85cff}
button{
  width:100%; margin-top:18px; padding:15px; border:0; border-radius:13px;
  background:linear-gradient(90deg,#ff3c46,#ef4f4f);color:#fff;
  font-size:17px;font-weight:800;cursor:pointer;
}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{display:none;margin-top:18px;padding:14px;border-radius:12px;line-height:1.7}
.success{display:block;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35)}
.error{display:block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35)}
.info{margin-top:24px;color:#aaa3b5;font-size:13px;line-height:1.8}
</style>
</head>
<body>

<div class="card">
  <div class="logo">KIVO</div>
  <div class="subtitle">
   <div data-string="txt1">

        </div><br>
        <div data-string="txt2">

        </div>
  </div>

  <label for="userId"><div data-string="txt3">

        </div></label>
  <input id="userId" type="text" placeholder="example: 123456" autocomplete="off">
  <label for="userEmail"><div data-string="txt4">

        </div></label>
<input id="userId" type="email" placeholder="example@gmail.com" autocomplete="off">
  <button id="submitBtn" onclick="submitRequest()"><div data-string="txt5">

        </div></button>

  <div id="message" class="msg"></div>

  <div class="info">
   <div data-string="txt6">

        </div>
  </div>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import { getDatabase, ref, push, set, serverTimestamp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";


const firebaseConfig = {
  databaseURL: "https://kivo-live-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.submitRequest = async function () {
  const input = document.getElementById("userId");
  const input2 = document.getElementById("userEmail");
  const button = document.getElementById("submitBtn");
  const message = document.getElementById("message");

  const userId = input.value.trim();
  const userEmail = input.value.trim();

  message.className = "msg";
  message.textContent = "";

  if (!userId) {
    message.className = "msg error";
    message.textContent = "Please enter the account ID.";
    return;
  }
  if (userId.length < 3 || userId.length > 30) {
    message.className = "msg error";
    message.textContent = "The account ID is invalid.";
    return;
  }
  button.disabled = true;
  button.textContent = "Sending the request...";

  try {
    const requestRef = push(ref(db, "accountDeletionRequests"));

    await set(requestRef, {
      userId: userId,
      userEmail: userEmail,
      status: "pending",
      requestedAt: serverTimestamp(),
      source: "kivo_delete_account_web"
    });

    message.className = "msg success";
    message.textContent =
      "The account deletion request has been successfully sent. The request will be reviewed by the KIVO team.";
    input.value = "";

  } catch (error) {
    console.error(error);
    message.className = "msg error";
    message.textContent =
      "Unable to send the request. Check your internet connection and try again.";
  } finally {
    button.disabled = false;
    button.textContent = "Submit an account deletion request";
  }
};
</script>
<!-- =====================================================

===================================================== -->

<script src="strings.js"></script>


<script>

const lang =
    navigator.language
        .split("-")[0];


if (
    typeof strings !== "undefined"
) {

    document
        .querySelectorAll(
            "[data-string]"
        )
        .forEach(element => {


            const key =
                element.getAttribute(
                    "data-string"
                );


            if (
                strings[lang] &&
                strings[lang][key]
            ) {

                element.textContent =
                    strings[lang][key];

            }

            else if (
                strings.en &&
                strings.en[key]
            ) {

                element.textContent =
                    strings.en[key];

            }

        });

}

</script>
</body>
</html>
